<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>FAIR CUT</title>
<meta name="description" content="One straight cut. Equal cake AND equal cherries. Math says it is always possible. Can you find it?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fdf6ec; --ink: #26213a; --muted: #8f86a0; --card: #fffdf8; --line: #eadfce; color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Fredoka", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  main { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
  .bar { width: min(560px, 100%); display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .bar h1 { font-size: 22px; font-weight: 600; flex: 1; text-align: center; }
  .icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; background: var(--card); border: 2px solid var(--line); text-decoration: none; color: inherit; }
  .portal .web-only { visibility: hidden; }
  #task { font-size: 21px; font-weight: 600; text-align: center; line-height: 1.25; max-width: 460px; }
  #task b { color: #e8475f; }
  #sub { font-size: 14px; color: var(--muted); text-align: center; }
  #tries { display: flex; gap: 8px; font-size: 22px; height: 28px; }
  #tries span.used { opacity: .2; filter: grayscale(1); }
  #stage { flex: 1; width: 100%; min-height: 0; display: grid; place-items: center; }
  #board { touch-action: none; display: block; cursor: crosshair; }
  #hint { font-size: 16px; color: var(--muted); min-height: 22px; text-align: center; }
  .controls { display: flex; gap: 10px; width: min(560px, 100%); justify-content: center; min-height: 54px; flex-wrap: wrap; }
  .btn { flex: 1; max-width: 220px; padding: 13px 10px; border-radius: 16px; font-size: 18px; font-weight: 600; background: var(--card); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: 0 4px 0 #120f1c; }
  .btn[hidden] { display: none; }
  .overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(253, 246, 236, .86); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); padding: 16px; z-index: 5; }
  .overlay.on { display: grid; }
  .card { width: min(380px, 100%); background: var(--card); border: 2px solid var(--line); border-radius: 24px; padding: 24px 22px 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; box-shadow: 0 20px 50px rgba(38, 33, 58, .18); animation: pop .35s cubic-bezier(.2, 1.5, .4, 1); max-height: calc(100vh - 32px); overflow-y: auto; }
  @keyframes pop { from { transform: scale(.75); opacity: 0; } }
  .card h2 { font-size: 30px; line-height: 1.1; }
  .card p { font-size: 16px; color: var(--muted); line-height: 1.4; }
  .stars { font-size: 40px; letter-spacing: 6px; }
  .stars .off { filter: grayscale(1) opacity(.25); }
  .card .btn { width: 100%; max-width: none; }
  .row { display: flex; gap: 10px; width: 100%; }
  .grid { width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .lv { aspect-ratio: 1; border-radius: 12px; background: #fff; border: 2px solid var(--line); font-size: 17px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .lv small { font-size: 9px; color: #e8a400; margin-top: 3px; height: 9px; letter-spacing: 1px; }
  .lv:disabled { opacity: .35; cursor: default; }
  .lv.cur { border-color: var(--ink); }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 6; }
  #toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 9; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <a class="icon web-only" href="../" aria-label="More games">←</a>
    <h1 id="title">Level 1</h1>
    <button class="icon" id="bDaily" aria-label="Daily cake">📅</button>
    <button class="icon" id="bLevels" aria-label="Levels">▦</button>
    <button class="icon" id="bMute" aria-label="Sound">🔊</button>
  </div>
  <div id="task"></div>
  <div id="sub">Math says there is always exactly such a cut.</div>
  <div id="tries"></div>
  <div id="stage"><canvas id="board"></canvas></div>
  <div id="hint"></div>
  <div class="controls">
    <button class="btn" id="bRetry" hidden>↻ Try again</button>
    <button class="btn" id="bShow" hidden>💡 Show the fair cut</button>
    <button class="btn primary" id="bNext" hidden>Results →</button>
  </div>
</main>

<div class="overlay" id="result"><div class="card">
  <h2 id="rTitle">Fair!</h2>
  <div class="stars" id="rStars"></div>
  <p id="rText"></p>
  <button class="btn primary" id="rNext">Next level →</button>
  <div class="row"><button class="btn" id="rRetry">Replay</button><button class="btn" id="rShare">Share</button></div>
</div></div>
<div class="overlay" id="levels"><div class="card">
  <h2>Levels</h2>
  <div class="grid" id="grid"></div>
  <button class="btn" id="lClose">Back</button>
</div></div>
<div id="toast"></div>
<canvas id="fx"></canvas>

<script src="../portal.js?v=2"></script>
<script src="../fifty-fifty/shapes.js"></script>
<script src="fair.js"></script>
<script>
(() => {
'use strict';
const { level, daily, shares, lineFromPoints, sideFn, clip, LEVELS } = window.Fair;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TRIES = 3;

// ---------- save ----------
const save = { unlocked: 1, best: {}, current: 1, mute: false, daily: {} };
const persist = () => Portal.storage.set('faircut', JSON.stringify(save));
const today = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; })();
const dailyNo = (() => { const [y, m, d] = today.split('-').map(Number); return Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(2026, 9, 12)) / 864e5) + 1; })();

// ---------- sound ----------
let ac = null, portalMuted = false;
const muted = () => save.mute || portalMuted;
function audio() { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {} if (ac && ac.state === 'suspended') ac.resume(); return ac; }
function tone(f, d, v, type = 'sine', when = 0, slide = 0) {
  if (muted() || !audio()) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .05);
}
function swish() {
  if (muted() || !audio()) return;
  const len = ac.sampleRate * .3, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = buf; f.type = 'bandpass'; f.frequency.setValueAtTime(5000, ac.currentTime); f.frequency.exponentialRampToValueAtTime(900, ac.currentTime + .25);
  g.gain.value = .35; s.connect(f).connect(g).connect(ac.destination); s.start();
}
const sfx = {
  cut: () => { swish(); tone(180, .12, .12, 'triangle', .02); },
  tick: (i) => tone(500 + i * 40, .04, .03, 'square'),
  great: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, .4, .12, 'triangle', i * .08)),
  ok: () => { tone(660, .25, .1, 'triangle'); tone(880, .3, .08, 'triangle', .1); },
  bad: () => { tone(220, .25, .1, 'square', 0, -60); tone(160, .35, .1, 'square', .18, -40); },
  reveal: () => [523, 659, 784].forEach((f, i) => tone(f, .5, .08, 'sine', i * .12)),
};

// ---------- state ----------
let L, G;
const extraName = () => (L.kind === 'cherry' ? 'cherries' : 'chocolate');
function start(lv) {
  L = lv;
  G = { tries: 0, best: null, cut: null, cutT: 0, drag: null, shown: false };
  if (!L.daily) { save.current = L.n; persist(); }
  $('title').textContent = L.daily ? `Daily #${dailyNo}` : `Level ${L.n}`;
  $('task').innerHTML = L.kind === 'cherry'
    ? 'One cut: equal <b>cake</b> AND equal <b>cherries</b> 🍒'
    : 'One cut: equal <b>cake</b> AND equal <b>chocolate</b> 🍫';
  $('hint').textContent = !L.daily && L.n === 1 ? 'Swipe across the cake to cut it' : '';
  hide('result'); hide('levels');
  updateTries(); controls(); resize();
  Portal.start();
}
function updateTries() { $('tries').innerHTML = Array.from({ length: TRIES }, (_, i) => `<span class="${i < G.tries ? 'used' : ''}">🔪</span>`).join(''); }
// a cut is as good as its worse half
const errOf = (s) => Math.max(Math.abs(s.cake - .5), Math.abs(s.extra - .5)) * 100;
const starsFor = (e) => (e <= 1 ? 3 : e <= 3 ? 2 : e <= 6 ? 1 : 0);
function verdict(s) {
  const e = errOf(s), cakeOk = Math.abs(s.cake - .5) * 100 <= 1, exOk = Math.abs(s.extra - .5) * 100 <= 1;
  if (e <= .4) return ['PERFECTLY FAIR! 🎯', '#16a34a'];
  if (cakeOk && exOk) return ['Fair! 🔥', '#16a34a'];
  if (cakeOk) return [`Cake ✓  ${L.kind === 'cherry' ? 'Cherries' : 'Chocolate'} ✗ 😬`, '#ff8a3d'];
  if (exOk) return [`${L.kind === 'cherry' ? 'Cherries' : 'Chocolate'} ✓  Cake ✗ 😬`, '#ff8a3d'];
  return e <= 6 ? ['Almost fair 😬', '#ff8a3d'] : ['Unfair! 😤', '#e5484d'];
}
function controls() {
  const ready = G.cut && G.cutT >= 1.1;
  const done = G.tries >= TRIES || (G.best && G.best.err <= 1);
  $('bRetry').hidden = !ready || done;
  $('bShow').hidden = !ready || G.tries < TRIES || G.shown || (G.best && G.best.err <= 1);
  $('bNext').hidden = !ready;
}

// ---------- drawing ----------
const cv = $('board'), g = cv.getContext('2d');
let S = 300, dpr = 1;
function resize() {
  const r = $('stage').getBoundingClientRect();
  S = Math.floor(Math.max(220, Math.min(r.width - 8, r.height - 8, 560)));
  dpr = Math.min(devicePixelRatio || 1, 3);
  cv.style.width = cv.style.height = S + 'px'; cv.width = cv.height = Math.round(S * dpr);
}
addEventListener('resize', resize);
const U = () => S * .46;
const toPx = ([x, y]) => [S / 2 + x * U(), S / 2 + y * U()];
const toUnit = ([x, y]) => [(x - S / 2) / U(), (y - S / 2) / U()];
function regionPath(reg, off = [0, 0]) {
  g.beginPath();
  for (const r of (Array.isArray(reg) ? reg : [reg])) for (const ring of [r.outer, ...(r.holes || [])]) {
    if (ring.length < 3) continue;
    ring.forEach((p, i) => { const [x, y] = toPx(p); i ? g.lineTo(x + off[0], y + off[1]) : g.moveTo(x + off[0], y + off[1]); });
    g.closePath();
  }
}
const cut = (reg, side) => (Array.isArray(reg) ? reg : [reg]).map((r) => ({ outer: clip(r.outer, side), holes: (r.holes || []).map((h) => clip(h, side)).filter((h) => h.length > 2) })).filter((r) => r.outer.length > 2);
function drawCake(cake, extra, cherries, off, shade = 0) {
  // shadow, sponge edge, frosting
  regionPath(cake, [off[0] + 6, off[1] + 12]); g.fillStyle = 'rgba(38,33,58,.12)'; g.fill('evenodd');
  regionPath(cake, [off[0], off[1] + 6]); g.fillStyle = '#e9b57e'; g.fill('evenodd');
  regionPath(cake, off); g.fillStyle = shade ? '#ffc9d6' : '#ffd6e0'; g.fill('evenodd');
  g.lineWidth = 4; g.lineJoin = 'round'; g.strokeStyle = '#f19bb1'; g.stroke();
  if (L.kind === 'choc') {
    regionPath(extra, off); g.fillStyle = '#7b4a2e'; g.fill('evenodd');
    g.strokeStyle = '#5c3520'; g.lineWidth = 3; g.stroke();
  } else {
    // cherries are clipped to this piece, so a cut cherry shows its half
    regionPath(cake, off); g.save(); g.clip('evenodd');
    for (const piece of extra) {
      regionPath(piece, off); g.fillStyle = '#e8304a'; g.fill();
    }
    g.restore();
    for (const [x, y] of cherries) {
      const [px, py] = toPx([x, y]);
      if (!extra.some((pc) => pc.outer.length > 2 && Math.hypot(...centroidOf(pc.outer).map((v, i) => v - [x, y][i])) < L.R * 1.2)) continue;
      g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.arc(px + off[0] - L.R * U() * .3, py + off[1] - L.R * U() * .35, L.R * U() * .28, 0, 7); g.fill();
      g.strokeStyle = '#5c8a3a'; g.lineWidth = 3; g.beginPath(); g.moveTo(px + off[0], py + off[1] - L.R * U() * .8); g.quadraticCurveTo(px + off[0] + 6, py + off[1] - L.R * U() * 1.6, px + off[0] + 12, py + off[1] - L.R * U() * 1.9); g.stroke();
    }
  }
}
function centroidOf(p) {
  let a = 0, x = 0, y = 0;
  for (let i = 0; i < p.length; i++) { const [x1, y1] = p[i], [x2, y2] = p[(i + 1) % p.length], c = x1 * y2 - x2 * y1; a += c; x += (x1 + x2) * c; y += (y1 + y2) * c; }
  return Math.abs(a) < 1e-9 ? p[0] : [x / (3 * a), y / (3 * a)];
}
function lineAcross(p, q) {
  const dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy) || 1, k = S * 2 / len;
  return [[p[0] - dx * k, p[1] - dy * k], [q[0] + dx * k, q[1] + dy * k]];
}
function label(text, x, y, size, color) {
  g.font = `700 ${size}px Fredoka, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = size * .24; g.lineJoin = 'round'; g.strokeStyle = '#fffdf8'; g.strokeText(text, x, y);
  g.fillStyle = color; g.fillText(text, x, y);
}
const extraLabel = (share) => (L.kind === 'cherry' ? `🍒 ${(share * L.cherries.length).toFixed(1)}` : `🍫 ${(share * 100).toFixed(1)}%`);
function frame(now) {
  requestAnimationFrame(frame);
  drawFx();
  if (!L) return;
  const dt = Math.min(.05, (now - (frame.last || now)) / 1000); frame.last = now;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, S, S);
  if (!G.cut) {
    drawCake(L.cake, L.extra, L.cherries, [0, Math.sin(now / 600) * 2]);
    if (G.drag) {
      const [a, b] = lineAcross(G.drag.p, G.drag.q);
      g.save(); g.setLineDash([10, 8]); g.lineWidth = 3; g.strokeStyle = 'rgba(38,33,58,.55)';
      g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); g.restore();
    }
  } else {
    const c = G.cut; c.t += dt; G.cutT = c.t;
    const k = Math.min(1, c.t / .35), sep = 16 * (1 - (1 - k) ** 3), n = c.n;
    for (const s of [1, -1]) {
      const side = sideFn(c.line.ang, c.line.off, s);
      drawCake(cut(L.cake, side), cut(L.extra, side), L.cherries, [n[0] * sep * s, n[1] * sep * s], s < 0);
    }
    if (c.t < .35) {
      const [a, b] = lineAcross(c.p, c.q);
      g.save(); g.globalAlpha = 1 - c.t / .35; g.lineWidth = 6; g.strokeStyle = '#fff'; g.shadowColor = '#fff'; g.shadowBlur = 18;
      g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); g.restore();
    }
    const cnt = clamp((c.t - .3) / .8, 0, 1), ce = 1 - (1 - cnt) ** 2;
    if (cnt > 0) {
      const ticks = Math.floor(cnt * 12); if (ticks > (c.ticks || 0)) { c.ticks = ticks; sfx.tick(ticks); }
      for (const s of [1, -1]) {
        const pieces = cut(L.cake, sideFn(c.line.ang, c.line.off, s));
        if (!pieces.length) continue;
        const big = pieces.reduce((a, b) => (b.outer.length > a.outer.length ? b : a));
        const [ux, uy] = centroidOf(big.outer), [px, py] = toPx([ux, uy]);
        const cake = s > 0 ? c.sh.cake : 1 - c.sh.cake, ex = s > 0 ? c.sh.extra : 1 - c.sh.extra;
        const fs = Math.max(18, S * .055), ox = n[0] * sep * s, oy = n[1] * sep * s;
        label(`🍰 ${(cake * 100 * ce).toFixed(1)}%`, px + ox, py + oy - fs * .6, fs, '#26213a');
        label(extraLabel(ex * ce), px + ox, py + oy + fs * .6, fs, '#26213a');
      }
    }
    if (c.t > 1.1 && !c.done) { c.done = true; onVerdict(c); }
    if (c.t > 1.1) {
      const [txt, col] = verdict(c.sh), pop = Math.min(1, (c.t - 1.1) / .2);
      g.save(); g.translate(S / 2, S * .06); g.scale(.6 + .4 * pop, .6 + .4 * pop); label(txt, 0, 0, Math.max(20, S * .062), col); g.restore();
    }
  }
  if (G.shown && L.solution) {
    // the fair cut, as the theorem promised
    const ang = L.solution.ang, off = L.solution.off, nx = -Math.sin(ang), ny = Math.cos(ang);
    const p0 = toPx([nx * off - Math.cos(ang) * 2, ny * off - Math.sin(ang) * 2]), p1 = toPx([nx * off + Math.cos(ang) * 2, ny * off + Math.sin(ang) * 2]);
    g.save(); g.setLineDash([14, 10]); g.lineWidth = 5; g.strokeStyle = '#e8a400'; g.shadowColor = '#fff'; g.shadowBlur = 8;
    g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.stroke(); g.restore();
  }
}
requestAnimationFrame(frame);

// ---------- cutting ----------
function doCut(p, q) {
  const line = lineFromPoints(toUnit(p), toUnit(q));
  const sh = shares(L, line);
  if (sh.cake < .002 || sh.cake > .998) { toast('Swipe through the cake'); return; }
  const err = errOf(sh);
  G.cut = { line, sh, p, q, err, t: 0, n: [-Math.sin(line.ang), Math.cos(line.ang)] };
  G.tries++; updateTries();
  if (!G.best || err < G.best.err) G.best = { err, sh };
  sfx.cut(); $('hint').textContent = '';
  controls();
}
function onVerdict(c) {
  const st = starsFor(c.err);
  if (st === 3) { sfx.great(); confetti(); Portal.happy(); } else if (st > 0) sfx.ok(); else sfx.bad();
  controls();
  if (st === 3) setTimeout(finish, 900);
}
function finish() {
  const st = starsFor(G.best.err);
  Portal.stop();
  if (L.daily) { const p = save.daily[today]; if (!p || G.best.err < p.err) save.daily[today] = { err: G.best.err }; }
  else { save.best[L.n] = Math.max(save.best[L.n] || 0, st); if (st > 0 && L.n >= save.unlocked) save.unlocked = Math.min(LEVELS.length, L.n + 1); }
  persist();
  const s = G.best.sh;
  $('rTitle').textContent = verdict(s)[0];
  $('rStars').innerHTML = [0, 1, 2].map((i) => `<span class="${i < st ? '' : 'off'}">⭐</span>`).join('');
  $('rText').innerHTML = `Best cut: cake ${(Math.min(s.cake, 1 - s.cake) * 100).toFixed(1)}% / ${(Math.max(s.cake, 1 - s.cake) * 100).toFixed(1)}%, ${extraName()} ${(Math.min(s.extra, 1 - s.extra) * 100).toFixed(1)}% / ${(Math.max(s.extra, 1 - s.extra) * 100).toFixed(1)}%`;
  $('rNext').textContent = L.daily ? 'Back to levels' : st > 0 ? 'Next level →' : 'Try this level again';
  show('result');
}

// ---------- input ----------
function local(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', (e) => { audio(); if (G.cut) return; cv.setPointerCapture(e.pointerId); const p = local(e); G.drag = { p, q: p }; });
cv.addEventListener('pointermove', (e) => { if (G.drag) G.drag.q = local(e); });
cv.addEventListener('pointerup', (e) => {
  if (!G.drag) return;
  const d = G.drag; G.drag = null; d.q = local(e);
  if (Math.hypot(d.q[0] - d.p[0], d.q[1] - d.p[1]) < 24) { toast('Swipe all the way across'); return; }
  doCut(d.p, d.q);
});
cv.addEventListener('pointercancel', () => (G.drag = null));
$('bRetry').addEventListener('click', () => { G.cut = null; G.cutT = 0; controls(); });
$('bShow').addEventListener('click', () => { G.shown = true; G.cut = null; sfx.reveal(); controls(); $('hint').textContent = 'This cut is fair for both. It always exists.'; });
$('bNext').addEventListener('click', () => finish());
$('rNext').addEventListener('click', () => { if (L.daily) { start(level(save.current)); return; } start(level(starsFor(G.best.err) > 0 ? Math.min(LEVELS.length, L.n + 1) : L.n)); });
$('rRetry').addEventListener('click', () => start(L.daily ? daily(today) : level(L.n)));
$('rShare').addEventListener('click', async () => {
  const s = G.best.sh, st = starsFor(G.best.err);
  const head = L.daily ? `FAIR CUT Daily #${dailyNo}` : `FAIR CUT Level ${L.n}`;
  const text = `${head} 🍰\nOne cut, equal cake AND ${extraName()}: off by ${G.best.err.toFixed(1)}% ${'⭐'.repeat(st)}\nMath says it's always possible. bugarcade.github.io/fair-cut/`;
  try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); toast('Copied!'); } } catch {}
});
$('bDaily').addEventListener('click', () => start(daily(today)));
$('bLevels').addEventListener('click', () => { buildGrid(); show('levels'); });
$('lClose').addEventListener('click', () => hide('levels'));
$('bMute').addEventListener('click', () => { save.mute = !save.mute; persist(); muteIcon(); });
const muteIcon = () => ($('bMute').textContent = muted() ? '🔇' : '🔊');
addEventListener('keydown', (e) => { if (e.key === 'r' && !$('bRetry').hidden) $('bRetry').click(); if (e.key === 'Enter' && $('result').classList.contains('on')) $('rNext').click(); });
function buildGrid() {
  const grid = $('grid'); grid.innerHTML = '';
  for (let n = 1; n <= LEVELS.length; n++) {
    const b = document.createElement('button'); b.className = 'lv' + (n === save.current ? ' cur' : '');
    b.disabled = n > save.unlocked;
    b.innerHTML = `${n > save.unlocked ? '🔒' : n}<small>${'★'.repeat(save.best[n] || 0)}</small>`;
    b.addEventListener('click', () => start(level(n)));
    grid.appendChild(b);
  }
}
function show(id) { $(id).classList.add('on'); }
function hide(id) { $(id).classList.remove('on'); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1400); }

// ---------- confetti ----------
const fx = $('fx'), fc = fx.getContext('2d'); let parts = [];
function confetti() {
  fx.width = innerWidth; fx.height = innerHeight; const r = cv.getBoundingClientRect();
  for (let i = 0; i < 100; i++) parts.push({ x: r.left + r.width / 2, y: r.top + r.height / 2, vx: (Math.random() - .5) * 15, vy: -Math.random() * 15 - 4, c: ['#ff6b6b', '#ffd43b', '#69db7c', '#4dabf7', '#da77f2'][i % 5], s: 5 + Math.random() * 6, a: Math.random() * 6, life: 0 });
}
function drawFx() {
  if (!parts.length) return;
  fc.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter((p) => p.life < 120);
  for (const p of parts) { p.vy += .45; p.x += p.vx; p.y += p.vy; p.a += .2; p.life++; fc.save(); fc.translate(p.x, p.y); fc.rotate(p.a); fc.fillStyle = p.c; fc.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fc.restore(); }
  if (!parts.length) fc.clearRect(0, 0, fx.width, fx.height);
}

Portal.ready.then(() => {
  try { Object.assign(save, JSON.parse(Portal.storage.get('faircut')) || {}); } catch {}
  muteIcon();
  start(level(Math.min(save.current || 1, save.unlocked)));
  Portal.loaded();
});
Portal.onMute((m) => { portalMuted = m; muteIcon(); });
// test hook: drive frames by hand (rAF pauses in hidden tabs)
window.__fc = { get G() { return G; }, get L() { return L; }, doCut, start, level, daily, toPx, frame };
})();
</script>
