<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>No Internet</title>
<meta name="description" content="No internet? Run, little dino. A pixel runner for when the Wi-Fi is down.">
<style>
  :root { --bg: #f7f7f7; --fg: #535353; color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: "Courier New", ui-monospace, Menlo, monospace;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    transition: background .6s;
  }
  body.night { --bg: #202124; --fg: #c8c8c8; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #err {
    position: fixed; left: 50%; top: 12%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px));
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); pointer-events: none; transition: opacity .4s;
  }
  #err h1 { font-size: 22px; font-weight: 500; margin-bottom: 10px; }
  #err p { font-size: 14px; line-height: 1.6; opacity: .85; }
  #err ul { font-size: 14px; line-height: 1.7; margin: 8px 0 0 20px; opacity: .85; }
  #err .code { font-size: 12px; margin-top: 14px; opacity: .6; letter-spacing: .5px; }
  #more {
    position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    font-family: system-ui, sans-serif; font-size: 13px; color: var(--fg); opacity: .6; text-decoration: none;
  }
  #more:hover { opacity: 1; }
  #mute { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 14px; background: none; border: none; font-size: 18px; cursor: pointer; opacity: .6; }
  @media (max-height: 520px) { #err { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err">
  <h1>No internet</h1>
  <p>Try:</p>
  <ul>
    <li>Checking the network cables, modem and router</li>
    <li>Reconnecting to Wi-Fi</li>
    <li>Running really fast 🦖</li>
  </ul>
  <p class="code">ERR_INTERNET_DISCONNECTED</p>
</div>
<button id="mute" title="Sound (M)">🔊</button>
<a id="more" href="../">← More games at Bug Arcade</a>

<script>
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $err = document.getElementById('err');
const $mute = document.getElementById('mute');

// ---------- Pixel sprites (original art; '#' = ink, '.' = empty) ----------
const BODY = [
  '..........########..',
  '.........##.#######.',
  '.........##########.',
  '.........##########.',
  '.........#####......',
  '.........########...',
  '#.......#####.......',
  '#.....#######.......',
  '##...#########......',
  '###.##########.#....',
  '##############......',
  '.############.......',
  '..##########........',
  '...########.........',
];
const LEGS = {
  stand: ['....###.##..........', '....##...#..........', '....#....#..........', '....##...##.........'],
  a:     ['....###.##..........', '....##...#..........', '....#....##.........', '....##..............'],
  b:     ['....###.##..........', '....#....#..........', '....##...#..........', '.........##.........'],
};
const DEAD_BODY = BODY.map((r, i) => i === 1 ? '.........#.#.######.' : i === 2 ? '.........##.########' : r);
const DUCK = {
  a: [
    '#.......#######.########..',
    '##....######################',
    '###.#######################.',
    '##########################..',
    '.########################...',
    '..##########.....#####......',
    '...###.##...................',
    '...##...#...................',
    '...#....##..................',
  ],
  b: [
    '#.......#######.########..',
    '##....######################',
    '###.#######################.',
    '##########################..',
    '.########################...',
    '..##########.....#####......',
    '...###.##...................',
    '...#....#...................',
    '...##...........................',
  ],
};
const BIRD = {
  up: [
    '....#...........',
    '....##..........',
    '..#.###.........',
    '.##.####........',
    '############....',
    '...##########...',
    '....#########...',
    '.....######.....',
  ],
  down: [
    '..#.............',
    '.##.............',
    '#######.........',
    '...##########...',
    '....#########...',
    '.....######.....',
    '.....####.......',
    '.....###........',
    '.....##.........',
  ],
};
const WIFI = [
  '..#######..',
  '.#.......#.',
  '#..#####..#',
  '..#.....#..',
  '....###....',
  '...#...#...',
  '.....#.....',
];

const DINO_W = 20, DINO_H = BODY.length + 4;

// ---------- Layout ----------
let W = 0, H = 0, DPR = 1, P = 3, GROUND = 0;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  P = Math.max(2, Math.min(4, Math.floor(Math.min(W / 190, H / 120))));
  GROUND = Math.round(H * (H > 520 ? 0.62 : 0.72));
}
addEventListener('resize', resize); resize();

function drawSprite(rows, x, y, color) {
  ctx.fillStyle = color;
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length; c++) if (row[c] === '#') ctx.fillRect(Math.round(x + c * P), Math.round(y + r * P), P, P);
  }
}

// ---------- Audio ----------
let AC = null, muted = false;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function beep(f, dur, type = 'square', vol = 0.08, delay = 0) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  jump() { beep(520, 0.06); beep(780, 0.06, 'square', 0.06, 0.04); },
  point() { beep(988, 0.07); beep(1319, 0.12, 'square', 0.07, 0.08); },
  hit() { beep(180, 0.12, 'square', 0.1); beep(120, 0.2, 'square', 0.1, 0.1); },
  wifi() { [660, 880, 1175].forEach((f, i) => beep(f, 0.08, 'triangle', 0.08, i * 0.06)); },
};
function toggleMute() { muted = !muted; $mute.textContent = muted ? '🔇' : '🔊'; }
$mute.addEventListener('click', e => { e.stopPropagation(); toggleMute(); });

// ---------- State ----------
const HI_KEY = 'no-internet-hi';
let hi = 0; try { hi = parseInt(localStorage.getItem(HI_KEY), 10) || 0; } catch (e) {}
let mode = 'idle'; // idle | play | over
let S = null;
const OVER_LINES = [
  'Still no internet.', 'Have you tried turning it off and on again?', 'Reconnecting… (no)',
  'ERR_DINO_DISCONNECTED', 'Your router says hi 👋', 'The cloud is down. Literally.',
];
const BAR_LINES = ['📶 1 bar…', '📶📶 2 bars!', '📶📶📶 CONNECTED!', '…lost it again 😩'];

function newState() {
  return {
    t: 0, score: 0, speed: 6.5, y: 0, vy: 0, duck: false, legT: 0, obstacles: [], clouds: [], wifi: [], bumps: [],
    nextObs: 60, nextCloud: 0, nextWifi: 900, night: false, nightT: 0, flash: 0, bars: 0, msg: null, overLine: '', groundX: 0, dead: false,
  };
}
S = newState();
for (let i = 0; i < 4; i++) S.clouds.push({ x: Math.random() * W, y: GROUND - rand(60, 140) * P / 3 });
function rand(a, b) { return a + Math.random() * (b - a); }

function start() {
  initAudio();
  S = newState();
  for (let i = 0; i < 3; i++) S.clouds.push({ x: Math.random() * W, y: GROUND - rand(60, 140) * P / 3 });
  mode = 'play';
  $err.style.opacity = 0.0;
  document.body.classList.remove('night');
}

function jump() {
  if (mode !== 'play') { if (mode === 'idle' || (mode === 'over' && S.overT <= 0)) start(); if (mode === 'play') { S.vy = -jumpV(); sfx.jump(); } return; }
  if (S.y === 0 && !S.duck) { S.vy = -jumpV(); sfx.jump(); }
}
const jumpV = () => 15.5 * P / 3;
const GRAV = () => 0.85 * P / 3;

// ---------- Obstacles ----------
function cactus(kind) {
  // kind: small (1-3) or large (1-3); drawn procedurally
  const big = kind === 'large';
  const n = Math.random() < 0.6 ? 1 : Math.random() < 0.7 ? 2 : 3;
  const w = (big ? 10 : 7) * P, h = (big ? 24 : 17) * P;
  return { type: 'cactus', big, n, x: W + 10, w: w * n + (n - 1) * 2 * P, h, y: 0 };
}
function bird() {
  const lvls = [0, 9, 20]; // pixel units above ground (0 = must jump, 9 = jump or duck, 20 = duck is safe/ignore)
  const lv = lvls[Math.floor(Math.random() * 3)];
  return { type: 'bird', x: W + 10, w: 16 * P, h: 9 * P, alt: lv * P + 6 * P, flap: 0 };
}
function drawCactus(o, color) {
  const big = o.big, unitW = (big ? 10 : 7) * P;
  for (let i = 0; i < o.n; i++) {
    const x = o.x + i * (unitW + 2 * P), base = GROUND;
    const tw = (big ? 4 : 3) * P, th = o.h;
    ctx.fillStyle = color;
    const cx = x + unitW / 2 - tw / 2;
    ctx.fillRect(cx, base - th, tw, th);
    // arms
    const aw = (big ? 2 : 2) * P, ah = (big ? 8 : 6) * P;
    ctx.fillRect(x, base - th * 0.7 - ah * 0.2, aw, ah);
    ctx.fillRect(x, base - th * 0.7 + ah * 0.8 - aw, cx - x, aw);
    ctx.fillRect(x + unitW - aw, base - th * 0.8 - ah * 0.2, aw, ah);
    ctx.fillRect(cx + tw, base - th * 0.8 + ah * 0.8 - aw, x + unitW - aw - cx - tw + aw, aw);
    // spikes texture
    ctx.fillStyle = S.night ? '#202124' : '#f7f7f7';
    for (let k = 1; k < th / P - 1; k += 4) ctx.fillRect(cx + P, base - th + k * P, P, P);
  }
}

// ---------- Update ----------
let shown100 = 0;
function update(dt) {
  const f = dt * 60; // frame-normalised
  S.t += dt;
  S.speed = Math.min(16, 6.5 + S.t * 0.12);
  const v = S.speed * P / 3 * f;
  S.score += S.speed * dt * 1.7;
  S.groundX = (S.groundX + v) % (W * 2);

  // milestones
  const sc = Math.floor(S.score);
  if (Math.floor(sc / 100) > shown100) { shown100 = Math.floor(sc / 100); sfx.point(); S.flash = 0.9; }
  if (Math.floor(sc / 700) !== Math.floor((sc - S.speed * dt * 1.7) / 700) && sc > 50) { S.night = !S.night; document.body.classList.toggle('night', S.night); }

  // dino physics
  S.vy += GRAV() * f * (S.duck && S.y < 0 ? 3 : 1);
  S.y = Math.min(0, S.y + S.vy * f);
  if (S.y === 0) S.vy = 0;
  S.legT += dt * S.speed * 1.4;

  // spawn obstacles
  S.nextObs -= v;
  if (S.nextObs <= 0) {
    const r = Math.random();
    const o = (S.score > 350 && r < 0.22) ? bird() : cactus(Math.random() < 0.45 ? 'large' : 'small');
    S.obstacles.push(o);
    // always leave room to land and jump again: one full jump length plus margin
    const jumpLen = S.speed * P / 3 * (2 * jumpV() / GRAV());
    S.nextObs = o.w + jumpLen * rand(1.15, 2.1) + 30 * P / 3;
  }
  for (const o of S.obstacles) { o.x -= v * (o.type === 'bird' ? 1.08 : 1); if (o.type === 'bird') o.flap += dt; }
  S.obstacles = S.obstacles.filter(o => o.x + o.w > -20);

  // wifi pickups (the "connection" gag)
  S.nextWifi -= v;
  if (S.nextWifi <= 0) { S.wifi.push({ x: W + 10, alt: rand(18, 34) * P, t: 0 }); S.nextWifi = rand(1300, 2200) * P / 3; }
  for (const w of S.wifi) { w.x -= v; w.t += dt; }
  S.wifi = S.wifi.filter(w => w.x > -40 && !w.got);

  // clouds
  S.nextCloud -= v * 0.25;
  if (S.nextCloud <= 0) { S.clouds.push({ x: W + 20, y: GROUND - rand(70, 150) * P / 3 }); S.nextCloud = rand(200, 500); }
  for (const c of S.clouds) c.x -= v * 0.25;
  S.clouds = S.clouds.filter(c => c.x > -100);

  if (S.msg) { S.msg.t -= dt; if (S.msg.t <= 0) S.msg = null; }
  if (S.lostT > 0) { S.lostT -= dt; if (S.lostT <= 0) { S.bars = 0; S.msg = { text: BAR_LINES[3], t: 1.6 }; } }
  S.flash = Math.max(0, S.flash - dt);

  // collisions (shrunk boxes)
  const dx = dinoX(), dh = S.duck && S.y === 0 ? 9 * P : DINO_H * P, dw = (S.duck && S.y === 0 ? 26 : DINO_W) * P;
  const box = { x: dx + 3 * P, y: GROUND + S.y - dh + 2 * P, w: dw - 7 * P, h: dh - 3 * P };
  for (const o of S.obstacles) {
    const ob = o.type === 'cactus'
      ? { x: o.x + P, y: GROUND - o.h + P, w: o.w - 2 * P, h: o.h - P }
      : { x: o.x + 2 * P, y: GROUND - o.alt - o.h + 2 * P, w: o.w - 4 * P, h: o.h - 4 * P };
    if (box.x < ob.x + ob.w && box.x + box.w > ob.x && box.y < ob.y + ob.h && box.y + box.h > ob.y) { gameOver(); return; }
  }
  for (const w of S.wifi) {
    const wx = w.x, wy = GROUND - w.alt - 7 * P;
    if (box.x < wx + 11 * P && box.x + box.w > wx && box.y < wy + 7 * P && box.y + box.h > wy) {
      w.got = true; S.bars = Math.min(3, S.bars + 1); S.score += 50; sfx.wifi();
      S.msg = { text: BAR_LINES[S.bars - 1], t: 1.4 };
      if (S.bars === 3) S.lostT = 1.4;
    }
  }
}
const dinoX = () => Math.max(24, Math.min(W * 0.12, 120));

function gameOver() {
  mode = 'over'; S.dead = true; S.overT = 0.5;
  sfx.hit();
  const sc = Math.floor(S.score);
  if (sc > hi) { hi = sc; try { localStorage.setItem(HI_KEY, String(hi)); } catch (e) {} }
  S.overLine = OVER_LINES[Math.floor(Math.random() * OVER_LINES.length)];
  shown100 = 0;
}

// ---------- Draw ----------
function pad(n) { return String(Math.floor(n)).padStart(5, '0'); }
function draw() {
  const night = S.night, bg = night ? '#202124' : '#f7f7f7', fg = night ? '#c8c8c8' : '#535353', faint = night ? '#555' : '#c2c2c2';
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // stars at night
  if (night) { ctx.fillStyle = '#888'; for (let i = 0; i < 20; i++) ctx.fillRect((i * 97 + 13) % W, (i * 53) % (GROUND * 0.6), P, P); }
  // moon
  if (night) { ctx.fillStyle = '#ddd'; ctx.beginPath(); ctx.arc(W * 0.72, GROUND * 0.25, 6 * P, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(W * 0.72 + 3 * P, GROUND * 0.25 - P, 6 * P, 0, Math.PI * 2); ctx.fill(); }

  // clouds
  ctx.fillStyle = faint;
  for (const c of S.clouds) {
    const x = Math.round(c.x), y = Math.round(c.y);
    ctx.fillRect(x + 4 * P, y, 8 * P, P); ctx.fillRect(x + 2 * P, y + P, 3 * P, P); ctx.fillRect(x + 11 * P, y + P, 3 * P, P);
    ctx.fillRect(x, y + 2 * P, 3 * P, P); ctx.fillRect(x + 13 * P, y + 2 * P, 4 * P, P); ctx.fillRect(x, y + 3 * P, 17 * P, P);
  }

  // ground line with bumps
  ctx.fillStyle = fg;
  ctx.fillRect(0, GROUND - P, W, P);
  for (let i = 0; i < W / (12 * P) + 2; i++) {
    const gx = ((i * 41 * P - S.groundX) % (W + 60) + W + 60) % (W + 60) - 30;
    ctx.fillRect(gx, GROUND + 2 * P + ((i * 7) % 3) * P, ((i * 13) % 4 + 1) * P, P);
    if (i % 3 === 0) ctx.fillRect(gx + 20 * P, GROUND - 2 * P, 3 * P, P);
  }

  // wifi pickups
  for (const w of S.wifi) drawSprite(WIFI, w.x, GROUND - w.alt - 7 * P + Math.sin(w.t * 5) * 2 * P, night ? '#8ab4f8' : '#1a73e8');

  // obstacles
  for (const o of S.obstacles) {
    if (o.type === 'cactus') drawCactus(o, fg);
    else drawSprite(Math.floor(o.flap * 6) % 2 ? BIRD.up : BIRD.down, o.x, GROUND - o.alt - o.h, fg);
  }

  // dino
  const dx = dinoX();
  if (mode === 'play' && S.duck && S.y === 0) {
    const fr = Math.floor(S.legT) % 2 ? DUCK.a : DUCK.b;
    drawSprite(fr, dx, GROUND - 9 * P, fg);
  } else {
    const body = S.dead ? DEAD_BODY : BODY;
    const legs = mode !== 'play' || S.y < 0 || S.dead ? LEGS.stand : (Math.floor(S.legT) % 2 ? LEGS.a : LEGS.b);
    const y = GROUND + S.y - DINO_H * P;
    const blink = mode === 'idle' && Math.floor(performance.now() / 2200) % 2 === 0 && performance.now() % 2200 < 150;
    drawSprite(blink ? BODY.map((r, i) => i === 1 ? '.........##########.' : r) : body, dx, y, fg);
    drawSprite(legs, dx, y + BODY.length * P, fg);
  }

  // score
  ctx.fillStyle = fg; ctx.textAlign = 'right';
  ctx.font = `700 ${Math.max(14, 5 * P)}px "Courier New", monospace`;
  const flashHide = S.flash > 0 && Math.floor(S.flash * 8) % 2 === 0;
  const scoreTxt = (hi ? `HI ${pad(hi)}  ` : '') + (flashHide ? '     ' : pad(S.score));
  ctx.fillText(scoreTxt, W - 16, Math.max(52, GROUND - 150 * P / 3));
  if (S.bars) { ctx.textAlign = 'left'; ctx.fillText('📶'.repeat(S.bars), 16, Math.max(52, GROUND - 150 * P / 3)); }

  // messages
  ctx.textAlign = 'center';
  if (S.msg) { ctx.font = `700 ${Math.max(14, 5 * P)}px "Courier New", monospace`; ctx.fillStyle = night ? '#8ab4f8' : '#1a73e8'; ctx.fillText(S.msg.text, W / 2, GROUND - 95 * P / 3); }
  if (mode === 'idle') {
    ctx.fillStyle = fg; ctx.font = `700 ${Math.max(13, 4 * P)}px "Courier New", monospace`;
    ctx.fillText(matchMedia('(pointer: coarse)').matches ? 'Tap to jump · swipe down to duck' : 'Press SPACE to jump · ↓ to duck', W / 2, GROUND + 22 * P);
  }
  if (mode === 'over') {
    ctx.fillStyle = fg; ctx.font = `700 ${Math.max(18, 7 * P)}px "Courier New", monospace`;
    ctx.fillText('G A M E   O V E R', W / 2, GROUND - 70 * P / 3);
    ctx.font = `700 ${Math.max(12, 4 * P)}px "Courier New", monospace`;
    ctx.fillText(S.overLine, W / 2, GROUND - 48 * P / 3);
    // restart icon
    const cx = W / 2, cy = GROUND - 22 * P / 3 + 4 * P, r = 6 * P;
    ctx.strokeStyle = fg; ctx.lineWidth = 2 * P; ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI * 0.2, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + r * 0.2, cy - r - 2 * P); ctx.lineTo(cx + r * 0.2 + 4 * P, cy - r); ctx.lineTo(cx + r * 0.2, cy - r + 2 * P); ctx.closePath(); ctx.fillStyle = fg; ctx.fill();
  }
}

// ---------- Input ----------
addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); jump(); }
  else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault(); if (mode === 'play') S.duck = true; }
  else if (e.key === 'm' || e.key === 'M') toggleMute();
});
addEventListener('keyup', e => { if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { if (S) S.duck = false; } });
let tp = null;
cv.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); tp = { y: e.clientY, ducked: false }; });
cv.addEventListener('pointermove', e => { if (tp && !tp.ducked && e.clientY - tp.y > 30 && mode === 'play') { tp.ducked = true; S.duck = true; } });
cv.addEventListener('pointerup', () => { if (tp && !tp.ducked) jump(); if (S) S.duck = false; tp = null; });
cv.addEventListener('pointercancel', () => { if (S) S.duck = false; tp = null; });
document.addEventListener('visibilitychange', () => { last = performance.now(); });

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.034, (now - last) / 1000); last = now;
  if (W !== innerWidth || H !== innerHeight) resize();
  if (mode === 'play') update(dt);
  if (mode === 'over') S.overT -= dt;
  draw();
  requestAnimationFrame(frame);
}
window.__dino = { get S() { return S; }, get mode() { return mode; }, start, jump, update, draw, gameOver };
requestAnimationFrame(frame);
</script>
</body>
</html>
