<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>HALF FULL</title>
<meta name="description" content="Hold to pour. Fill the glass exactly half full. Easy, until the glass isn't straight.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fdf6ec; --ink: #26213a; --muted: #8f86a0; --card: #fffdf8; --line: #eadfce; color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Fredoka", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  main { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
  .bar { width: min(560px, 100%); display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .bar h1 { font-size: 22px; font-weight: 600; flex: 1; text-align: center; }
  .icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; background: var(--card); border: 2px solid var(--line); text-decoration: none; color: inherit; }
  .portal .web-only { visibility: hidden; }
  #task { font-size: 23px; font-weight: 600; text-align: center; line-height: 1.2; }
  #task b { color: #ff6b4a; }
  #tries { display: flex; gap: 8px; font-size: 22px; height: 28px; }
  #tries span.used { opacity: .2; filter: grayscale(1); }
  #stage { flex: 1; width: 100%; min-height: 0; display: grid; place-items: center; }
  #scene { touch-action: none; display: block; cursor: pointer; }
  #hint { font-size: 16px; color: var(--muted); min-height: 22px; text-align: center; }
  .controls { display: flex; gap: 10px; width: min(560px, 100%); justify-content: center; min-height: 54px; }
  .btn { flex: 1; max-width: 220px; padding: 13px 10px; border-radius: 16px; font-size: 18px; font-weight: 600; background: var(--card); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: 0 4px 0 #120f1c; }
  .btn[hidden] { display: none; }
  .overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(253, 246, 236, .86); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); padding: 16px; z-index: 5; }
  .overlay.on { display: grid; }
  .card { width: min(380px, 100%); background: var(--card); border: 2px solid var(--line); border-radius: 24px; padding: 24px 22px 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; box-shadow: 0 20px 50px rgba(38, 33, 58, .18); animation: pop .35s cubic-bezier(.2, 1.5, .4, 1); max-height: calc(100vh - 32px); overflow-y: auto; }
  @keyframes pop { from { transform: scale(.75); opacity: 0; } }
  .card h2 { font-size: 32px; line-height: 1.1; }
  .card p { font-size: 17px; color: var(--muted); }
  .big { font-size: 54px; font-weight: 700; letter-spacing: -1px; }
  .stars { font-size: 40px; letter-spacing: 6px; }
  .stars .off { filter: grayscale(1) opacity(.25); }
  .card .btn { width: 100%; max-width: none; }
  .row { display: flex; gap: 10px; width: 100%; }
  .grid { width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .lv { aspect-ratio: 1; border-radius: 12px; background: #fff; border: 2px solid var(--line); font-size: 17px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .lv small { font-size: 9px; color: #e8a400; margin-top: 3px; height: 9px; letter-spacing: 1px; }
  .lv:disabled { opacity: .35; cursor: default; }
  .lv.cur { border-color: var(--ink); }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 6; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <a class="icon web-only" href="../" aria-label="More games">←</a>
    <h1 id="title">Level 1</h1>
    <button class="icon" id="bDaily" aria-label="Daily glass">📅</button>
    <button class="icon" id="bLevels" aria-label="Levels">▦</button>
    <button class="icon" id="bMute" aria-label="Sound">🔊</button>
  </div>
  <div id="task"></div>
  <div id="tries"></div>
  <div id="stage"><canvas id="scene"></canvas></div>
  <div id="hint"></div>
  <div class="controls">
    <button class="btn" id="bRetry" hidden>↻ Pour again</button>
    <button class="btn primary" id="bNext" hidden>Results →</button>
  </div>
</main>

<div class="overlay" id="result"><div class="card">
  <h2 id="rTitle">Nice pour!</h2>
  <div class="big" id="rBig">98%</div>
  <div class="stars" id="rStars"></div>
  <p id="rText"></p>
  <button class="btn primary" id="rNext">Next level →</button>
  <div class="row"><button class="btn" id="rRetry">Replay</button><button class="btn" id="rShare">Share</button></div>
</div></div>
<div class="overlay" id="levels"><div class="card">
  <h2>Levels</h2>
  <div class="grid" id="grid"></div>
  <button class="btn" id="lClose">Back</button>
</div></div>
<canvas id="fx"></canvas>

<script src="../portal.js?v=2"></script>
<script src="glasses.js"></script>
<script>
(() => {
'use strict';
const { level, daily, radiusAt, volumeAt, heightFor, LEVELS } = window.Half;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TRIES = 3;
const FRAC = { .5: 'HALF', .25: 'a QUARTER', .75: '3/4', .1: '10%', .9: '90%' };
const fracName = (f) => FRAC[f] || (Math.abs(f - 1 / 3) < 1e-6 ? '1/3' : Math.abs(f - 2 / 3) < 1e-6 ? '2/3' : Math.round(f * 100) + '%');

// ---------- save ----------
const save = { unlocked: 1, best: {}, current: 1, mute: false, daily: {} };
const persist = () => Portal.storage.set('halffull', JSON.stringify(save));
const today = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; })();
const dailyNo = (() => { const [y, m, d] = today.split('-').map(Number); return Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(2026, 9, 11)) / 864e5) + 1; })();

// ---------- sound: a pour whose pitch rises as the glass fills ----------
let ac = null, pourGain = null, pourFilter = null, portalMuted = false;
const muted = () => save.mute || portalMuted;
function audio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      pourFilter = ac.createBiquadFilter(); pourFilter.type = 'bandpass'; pourFilter.Q.value = 6; pourFilter.frequency.value = 400;
      pourGain = ac.createGain(); pourGain.gain.value = 0;
      src.connect(pourFilter).connect(pourGain).connect(ac.destination); src.start();
    } catch {}
  }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f, d, v, type = 'sine', when = 0, slide = 0) {
  if (muted() || !audio()) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .05);
}
function pourSound(rate, fill) {
  if (!pourGain) return;
  pourGain.gain.setTargetAtTime(muted() ? 0 : Math.min(.35, rate * 1.2), ac.currentTime, .04);
  pourFilter.frequency.setTargetAtTime(260 + fill * 1400, ac.currentTime, .05);
}
const sfx = {
  clink: () => { tone(2100, .25, .05); tone(2900, .2, .03, 'sine', .01); },
  great: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, .4, .12, 'triangle', i * .08)),
  ok: () => { tone(660, .25, .1, 'triangle'); tone(880, .3, .08, 'triangle', .1); },
  bad: () => { tone(220, .25, .1, 'square', 0, -60); tone(160, .35, .1, 'square', .18, -40); },
  spill: () => { tone(300, .5, .1, 'sawtooth', 0, -200); },
};

// ---------- state ----------
let L, G;
function start(lv) {
  L = lv;
  G = { tries: 0, best: null, results: [] };
  resetPour();
  if (!L.daily) { save.current = L.n; persist(); }
  $('title').textContent = L.daily ? `Daily #${dailyNo}` : `Level ${L.n}`;
  $('task').innerHTML = L.mode === 'line' ? 'Fill it <b>to the line</b>' : `Fill it exactly <b>${fracName(L.f)}</b> full`;
  $('hint').textContent = !L.daily && L.n <= 2 ? 'Hold anywhere to pour, let go to stop' : '';
  hide('result'); hide('levels');
  updateTries(); controls(); resize();
  Portal.start();
}
function resetPour() {
  G.ang = 60; G.hold = false; G.vol = 0; G.queue = []; G.lastArrive = -9; G.t = 0; G.phase = 'ready';
  G.wob = 0; G.bubbles = []; G.drops = []; G.spilled = 0; G.revealT = 0; G.poured = false;
}
function updateTries() { $('tries').innerHTML = Array.from({ length: TRIES }, (_, i) => `<span class="${i < G.tries ? 'used' : ''}">🥤</span>`).join(''); }
const accOf = (v) => v / L.target * 100;
const errOf = (v) => Math.abs(accOf(v) - 100);
const starsFor = (e) => (e <= 2 ? 3 : e <= 5 ? 2 : e <= 10 ? 1 : 0);
function verdict(v) {
  if (G.spilled > 0) return ['SPILLED 💦', '#e5484d'];
  const e = errOf(v), a = accOf(v);
  if (e <= .8) return ['PERFECT! 🎯', '#16a34a'];
  if (e <= 2) return ['So close! 🔥', '#16a34a'];
  if (e <= 5) return [a < 100 ? 'A bit short 👌' : 'A bit over 👌', '#e8a400'];
  if (e <= 10) return [a < 100 ? 'Too little 😬' : 'Too much 😬', '#ff8a3d'];
  return [a < 100 ? 'Way too little 😅' : 'Way too much 😅', '#e5484d'];
}
function controls() {
  const doneTry = G.phase === 'done';
  const finished = G.tries >= TRIES || (G.best && G.best.err <= 2);
  $('bRetry').hidden = !doneTry || finished;
  $('bNext').hidden = !doneTry;
}

// ---------- layout ----------
const cv = $('scene'), g = cv.getContext('2d');
let W = 360, Hh = 480, dpr = 1, GH = 200, RS = 200, CX = 200, Y0 = 400, LIP = [100, 100];
function resize() {
  const r = $('stage').getBoundingClientRect();
  W = Math.floor(Math.max(240, Math.min(r.width - 8, 560, (r.height - 8) / 1.3)));
  Hh = Math.floor(W * 1.3);
  dpr = Math.min(devicePixelRatio || 1, 3);
  cv.style.width = W + 'px'; cv.style.height = Hh + 'px'; cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  layout();
}
function layout() {
  if (!L) return;
  const gl = L.glass;
  GH = Hh * .44; RS = W * .62;
  CX = W * .56;
  const baseY = Hh * .95, stemH = gl.stem * GH * .55, baseH = gl.base * GH;
  Y0 = baseY - baseH - stemH;           // inner bottom of the liquid
  LIP = [CX - 6, Hh * .15];        // the stream falls from here, straight into the middle of the glass
}
addEventListener('resize', resize);
const yAt = (h) => Y0 - h * GH;
const rAt = (h) => radiusAt(L.glass, h) * RS * .5;

// ---------- simulation ----------
const STEP = 1 / 120;
function step(dt) {
  G.t += dt;
  if (G.phase === 'ready' && G.hold) { G.phase = 'pouring'; G.poured = true; sfx.clink(); }
  const target = G.hold && G.phase === 'pouring' ? 125 : 60; // 60° = resting tilt, clear of the glass
  G.ang += clamp(target - G.ang, -520 * dt, (G.hold ? 170 : 520) * dt); // snaps back fast when released
  const rate = G.phase === 'pouring' ? L.flow * Math.pow(clamp((G.ang - 72) / 50, 0, 1), 1.3) : 0;
  G.rate = rate;
  // liquid leaves the lip now and lands a moment later
  const fall = Math.sqrt(2 * Math.max(10, yAt(volH()) - LIP[1]) / 7000);
  if (rate > 0) G.queue.push({ at: G.t + fall, v: rate * dt });
  let arrived = 0;
  while (G.queue.length && G.queue[0].at <= G.t) arrived += G.queue.shift().v;
  if (arrived > 0) {
    G.lastArrive = G.t;
    G.vol += arrived;
    if (G.vol > 1) { G.spilled += G.vol - 1; G.vol = 1; }
    G.wob = Math.min(1, G.wob + arrived * 40);
    if (Math.random() < .5) G.bubbles.push({ x: (Math.random() - .5) * .8, h: 0, sp: .2 + Math.random() * .3, r: 1.5 + Math.random() * 3 });
    if (Math.random() < .3) for (let k = 0; k < 2; k++) G.drops.push({ x: LIP[0], y: yAt(volH()), vx: (Math.random() - .5) * 140, vy: -80 - Math.random() * 140, life: 0 });
  }
  G.wob *= Math.pow(.2, dt);
  for (const b of G.bubbles) b.h += b.sp * dt;
  G.bubbles = G.bubbles.filter((b) => b.h < volH());
  for (const d of G.drops) { d.vy += 900 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life += dt; }
  G.drops = G.drops.filter((d) => d.life < .5);
  pourSound(rate > 0 || G.queue.length ? Math.max(rate, .15) : 0, G.vol);
  // settled: nothing in the air, bottle upright
  if (G.phase === 'pouring' && !G.hold && G.ang < 66 && !G.queue.length && G.t - G.lastArrive > .5) settle();
  if (G.phase === 'reveal') { G.revealT += dt; if (G.revealT > 1.1) { G.phase = 'done'; controls(); afterTry(); } }
}
const volH = () => heightFor(L.glass, G.vol);
function settle() {
  G.phase = 'reveal'; G.revealT = 0;
  G.tries++; updateTries();
  const e = G.spilled > 0 ? 999 : errOf(G.vol);
  G.results.push(e);
  if (!G.best || e < G.best.err) G.best = { err: e, vol: G.vol, spilled: G.spilled > 0 };
  $('hint').textContent = '';
  const st = starsFor(e);
  if (G.spilled > 0) sfx.spill(); else if (e <= .8 || st === 3) { sfx.great(); confetti(); Portal.happy(); } else if (st > 0) sfx.ok(); else sfx.bad();
}
function afterTry() { if (G.tries >= TRIES || G.best.err <= 2) setTimeout(finish, 700); }
function finish() {
  const st = starsFor(G.best.err);
  Portal.stop();
  if (L.daily) { const p = save.daily[today]; if (!p || G.best.err < p.err) save.daily[today] = { err: G.best.err }; }
  else { save.best[L.n] = Math.max(save.best[L.n] || 0, st); if (st > 0 && L.n >= save.unlocked) save.unlocked = Math.min(LEVELS.length, L.n + 1); }
  persist();
  $('rBig').textContent = G.best.spilled ? '💦' : `${accOf(G.best.vol).toFixed(1)}%`;
  $('rTitle').textContent = G.best.spilled ? 'Spilled!' : verdict(G.best.vol)[0];
  $('rStars').innerHTML = [0, 1, 2].map((i) => `<span class="${i < st ? '' : 'off'}">⭐</span>`).join('');
  $('rText').textContent = G.best.spilled ? 'Every try overflowed.' : `of the target · off by ${G.best.err.toFixed(1)}%`;
  $('rNext').textContent = L.daily ? 'Back to levels' : st > 0 ? 'Next level →' : 'Try this level again';
  show('result');
}

// ---------- drawing ----------
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function glassPath(inset = 0) {
  // inner outline from the bottom-left up, across the rim, down the right
  const pts = [], n = 60;
  for (let i = 0; i <= n; i++) { const h = i / n; pts.push([CX - rAt(h) - inset, yAt(h)]); }
  for (let i = n; i >= 0; i--) { const h = i / n; pts.push([CX + rAt(h) + inset, yAt(h)]); }
  return pts;
}
function drawGlass(behind) {
  const gl = L.glass, wall = Math.max(4, W * .014);
  if (behind) {
    // faint back of the glass
    g.fillStyle = 'rgba(180,215,240,.18)'; g.beginPath(); glassPath().forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill();
    return;
  }
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.strokeStyle = 'rgba(120,150,175,.9)'; g.lineWidth = wall;
  const left = [], right = [];
  for (let i = 0; i <= 60; i++) { const h = i / 60; left.push([CX - rAt(h) - wall / 2, yAt(h)]); right.push([CX + rAt(h) + wall / 2, yAt(h)]); }
  g.beginPath(); left.reverse().forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
  right.forEach(([x, y]) => g.lineTo(x, y)); g.stroke();
  // bottom / stem / base
  const r0 = rAt(0);
  if (gl.stem > 0) {
    const sy = Y0 + wall / 2, ey = Y0 + gl.stem * GH * .55;
    g.lineWidth = wall * 1.4; g.beginPath(); g.moveTo(CX, sy); g.lineTo(CX, ey); g.stroke();
    g.lineWidth = wall; g.beginPath(); g.ellipse(CX, ey + 3, GH * .26, wall * 1.2, 0, 0, 7); g.stroke();
  } else {
    g.lineWidth = wall * 1.6; g.beginPath(); g.moveTo(CX - r0 - wall / 2, Y0 + wall * .6); g.lineTo(CX + r0 + wall / 2, Y0 + wall * .6); g.stroke();
  }
  // highlight
  g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = wall * .7;
  g.beginPath();
  for (let i = 8; i <= 52; i++) { const h = i / 60, x = CX - rAt(h) + wall * 1.4, y = yAt(h); i === 8 ? g.moveTo(x, y) : g.lineTo(x, y); }
  g.stroke();
  if (gl.marks) { // beaker graduations
    g.strokeStyle = 'rgba(120,150,175,.55)'; g.lineWidth = 2;
    for (let k = 1; k < 10; k++) { const y = yAt(k / 10); g.beginPath(); g.moveTo(CX + rAt(0) - 4, y); g.lineTo(CX + rAt(0) - (k % 5 ? 14 : 24), y); g.stroke(); }
  }
}
function drawLiquid(now) {
  if (G.vol <= 0) return;
  const h = volH(), col = L.drink[0];
  const top = yAt(h), wob = G.wob * Math.min(8, W * .02);
  g.save();
  g.beginPath();
  const n = 40;
  for (let i = 0; i <= n; i++) { const hh = h * i / n; g.lineTo(CX - rAt(hh), yAt(hh)); }
  // wavy surface
  const rl = rAt(h);
  for (let k = 0; k <= 20; k++) { const x = CX - rl + 2 * rl * k / 20; g.lineTo(x, top + Math.sin(now / 90 + k * .9) * wob * Math.sin(Math.PI * k / 20)); }
  for (let i = n; i >= 0; i--) { const hh = h * i / n; g.lineTo(CX + rAt(hh), yAt(hh)); }
  g.closePath();
  const gr = g.createLinearGradient(0, top, 0, Y0); gr.addColorStop(0, col); gr.addColorStop(1, shade(col, -.25));
  g.fillStyle = gr; g.fill();
  g.clip();
  g.fillStyle = 'rgba(255,255,255,.35)';
  for (const b of G.bubbles) { g.beginPath(); g.arc(CX + b.x * rAt(b.h), yAt(b.h), b.r, 0, 7); g.fill(); }
  g.restore();
  // surface sheen
  g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(CX, top, rl * .9, Math.max(1.5, rl * .06), 0, 0, 7); g.fill();
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f));
  return `rgb(${c.join(',')})`;
}
function drawBottle() {
  // the bottle turns around its lip: upright-ish at rest, mouth down when pouring
  const s = W * .0018;
  g.save(); g.translate(LIP[0], LIP[1]); g.rotate((G.ang - 90) * Math.PI / 180);
  // drawn with the lip at the origin, the body to the left
  g.fillStyle = 'rgba(80,150,110,.9)';
  rr(-150 * s, -22 * s, 40 * s, 44 * s, 6 * s); g.fill();                  // body far end (cap side)
  g.fillStyle = '#5aa977'; rr(-170 * s, -44 * s, 120 * s, 88 * s, 22 * s); g.fill();
  g.fillStyle = '#5aa977'; g.beginPath(); g.moveTo(-52 * s, -40 * s); g.quadraticCurveTo(-30 * s, -12 * s, 0, -12 * s); g.lineTo(0, 12 * s); g.quadraticCurveTo(-30 * s, 12 * s, -52 * s, 40 * s); g.fill();
  g.fillStyle = '#fffdf8'; rr(-150 * s, -26 * s, 70 * s, 52 * s, 8 * s); g.fill();
  g.fillStyle = L.drink[0]; g.beginPath(); g.arc(-115 * s, 0, 16 * s, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.35)'; rr(-160 * s, -38 * s, 100 * s, 12 * s, 6 * s); g.fill();
  g.restore();
}
function drawStream() {
  if (!G.rate && !G.queue.length) return;
  const w = Math.max(2, Math.min(W * .03, (G.rate || .05) * W * .09));
  const bottom = yAt(volH());
  const col = L.drink[0];
  g.strokeStyle = col; g.lineCap = 'round'; g.lineWidth = w;
  g.beginPath();
  // the stream curls out of the lip and falls, with a small wobble
  g.moveTo(LIP[0], LIP[1] + 2);
  for (let k = 1; k <= 12; k++) { const t = k / 12, y = LIP[1] + (bottom - LIP[1]) * t; g.lineTo(LIP[0] + Math.sin(G.t * 30 + k) * w * .12 + 6 * t, y); }
  g.globalAlpha = G.rate > 0 ? 1 : .6; g.stroke(); g.globalAlpha = 1;
  g.fillStyle = col;
  for (const d of G.drops) { g.beginPath(); g.arc(d.x + 6, d.y, Math.max(1.5, w * .25), 0, 7); g.fill(); }
}
function label(text, x, y, size, color, align = 'center') {
  g.font = `700 ${size}px Fredoka, sans-serif`; g.textAlign = align; g.textBaseline = 'middle';
  g.lineWidth = size * .22; g.lineJoin = 'round'; g.strokeStyle = '#fffdf8'; g.strokeText(text, x, y);
  g.fillStyle = color; g.fillText(text, x, y);
}
function drawTarget() {
  const showLine = L.mode === 'line' || G.phase === 'reveal' || G.phase === 'done';
  if (!showLine) return;
  const y = yAt(L.lineH), r = rAt(L.lineH);
  const k = L.mode === 'line' ? 1 : clamp(G.revealT / .5, 0, 1);
  g.save(); g.globalAlpha = k;
  g.setLineDash([10, 7]); g.strokeStyle = '#ff6b4a'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(CX - r - 18, y); g.lineTo(CX + r + 18, y); g.stroke(); g.setLineDash([]);
  label(L.mode === 'line' ? '' : fracName(L.f), CX + r + 26, y, Math.max(16, W * .045), '#ff6b4a', 'left');
  g.restore();
}
function drawResult() {
  if (G.phase !== 'reveal' && G.phase !== 'done') return;
  const k = clamp((G.revealT - .2) / .4, 0, 1) || (G.phase === 'done' ? 1 : 0);
  const [txt, col] = verdict(G.vol);
  g.save(); g.globalAlpha = k;
  label(txt, W / 2, Hh * .07, Math.max(22, W * .07), col);
  if (G.spilled <= 0) label(`${accOf(G.vol).toFixed(1)}% of target`, W / 2, Hh * .135, Math.max(16, W * .045), '#26213a');
  g.restore();
}
function frame(now) {
  requestAnimationFrame(frame);
  drawFx();
  if (!L) return;
  const dt = Math.min(.05, (now - (frame.last || now)) / 1000); frame.last = now;
  frame.acc = (frame.acc || 0) + dt;
  while (frame.acc >= STEP) { step(STEP); frame.acc -= STEP; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, Hh);
  // table
  g.fillStyle = '#efe3d0'; g.fillRect(0, Hh * .95, W, Hh * .05);
  drawGlass(true);
  drawStream();
  drawLiquid(now);
  drawGlass(false);
  drawTarget();
  drawBottle();
  drawResult();
  if (G.phase === 'ready' && !G.poured) {
    const p = (Math.sin(now / 300) + 1) / 2;
    label('HOLD TO POUR', W / 2, Hh * .05, Math.max(18, W * .05), `rgba(38,33,58,${.35 + .4 * p})`);
  }
}
requestAnimationFrame(frame);

// ---------- input: hold anywhere ----------
const press = () => { audio(); if (G.phase === 'ready' || G.phase === 'pouring') G.hold = true; };
const releaseP = () => { G.hold = false; };
cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); press(); });
cv.addEventListener('pointerup', releaseP); cv.addEventListener('pointercancel', releaseP);
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) press(); }
  if (e.key === 'r' && !$('bRetry').hidden) $('bRetry').click();
  if (e.key === 'Enter' && $('result').classList.contains('on')) $('rNext').click();
});
addEventListener('keyup', (e) => { if (e.code === 'Space') releaseP(); });
$('bRetry').addEventListener('click', () => { resetPour(); controls(); });
$('bNext').addEventListener('click', () => finish());
$('rNext').addEventListener('click', () => {
  if (L.daily) { start(level(save.current)); return; }
  start(level(starsFor(G.best.err) > 0 ? Math.min(LEVELS.length, L.n + 1) : L.n));
});
$('rRetry').addEventListener('click', () => start(L.daily ? daily(today) : level(L.n)));
$('rShare').addEventListener('click', async () => {
  const head = L.daily ? `HALF FULL Daily #${dailyNo}` : `HALF FULL Level ${L.n}`;
  const res = G.best.spilled ? 'spilled it 💦' : `${accOf(G.best.vol).toFixed(1)}% ${'⭐'.repeat(starsFor(G.best.err))}`;
  const text = `${head} 🍸\n${L.mode === 'line' ? 'To the line' : 'Fill it ' + fracName(L.f)}: ${res}\nCan you pour better? bugarcade.github.io/half-full/`;
  try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); } } catch {}
});
$('bDaily').addEventListener('click', () => start(daily(today)));
$('bLevels').addEventListener('click', () => { buildGrid(); show('levels'); });
$('lClose').addEventListener('click', () => hide('levels'));
$('bMute').addEventListener('click', () => { save.mute = !save.mute; persist(); muteIcon(); });
const muteIcon = () => ($('bMute').textContent = muted() ? '🔇' : '🔊');
function buildGrid() {
  const grid = $('grid'); grid.innerHTML = '';
  for (let n = 1; n <= LEVELS.length; n++) {
    const b = document.createElement('button'); b.className = 'lv' + (n === save.current ? ' cur' : '');
    b.disabled = n > save.unlocked;
    b.innerHTML = `${n > save.unlocked ? '🔒' : n}<small>${'★'.repeat(save.best[n] || 0)}</small>`;
    b.addEventListener('click', () => start(level(n)));
    grid.appendChild(b);
  }
}
function show(id) { $(id).classList.add('on'); }
function hide(id) { $(id).classList.remove('on'); }

// ---------- confetti ----------
const fx = $('fx'), fc = fx.getContext('2d'); let parts = [];
function confetti() {
  fx.width = innerWidth; fx.height = innerHeight; const r = cv.getBoundingClientRect();
  for (let i = 0; i < 100; i++) parts.push({ x: r.left + r.width / 2, y: r.top + r.height / 2, vx: (Math.random() - .5) * 15, vy: -Math.random() * 15 - 4, c: ['#ff6b6b', '#ffd43b', '#69db7c', '#4dabf7', '#da77f2'][i % 5], s: 5 + Math.random() * 6, a: Math.random() * 6, life: 0 });
}
function drawFx() {
  if (!parts.length) return;
  fc.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter((p) => p.life < 120);
  for (const p of parts) { p.vy += .45; p.x += p.vx; p.y += p.vy; p.a += .2; p.life++; fc.save(); fc.translate(p.x, p.y); fc.rotate(p.a); fc.fillStyle = p.c; fc.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fc.restore(); }
  if (!parts.length) fc.clearRect(0, 0, fx.width, fx.height);
}

Portal.ready.then(() => {
  try { Object.assign(save, JSON.parse(Portal.storage.get('halffull')) || {}); } catch {}
  muteIcon();
  start(level(Math.min(save.current || 1, save.unlocked)));
  Portal.loaded();
});
Portal.onMute((m) => { portalMuted = m; muteIcon(); });
// test hook: drive frames by hand (rAF pauses in hidden tabs)
window.__hf = { get G() { return G; }, get L() { return L; }, start, level, frame, press, release: releaseP };
})();
</script>
</body>
