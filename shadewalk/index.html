<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>SHADEWALK</title>
<meta name="description" content="A vampire is late home and the sun is up. You control the sun. Bend the shadows of the city to keep him in the shade.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2b2140; --card: #fffaf1; --line: #ecdcc4; --accent: #ff8a3d; color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #f9d9b5; font-family: "Fredoka", system-ui, sans-serif; color: var(--ink);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  #pauseBtn { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 14px; width: 48px; height: 48px; border-radius: 14px;
    background: rgba(255, 250, 241, .9); border: 2px solid var(--line); font-size: 20px; font-weight: 700; z-index: 3; }
  .overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(43, 33, 64, .45); z-index: 5; padding: 16px; }
  .overlay.on { display: grid; }
  .card { background: var(--card); border: 3px solid var(--line); border-radius: 26px; padding: 26px 26px 22px; width: min(420px, 100%);
    text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; box-shadow: 0 24px 60px rgba(43, 33, 64, .3);
    animation: pop .35s cubic-bezier(.2, 1.5, .4, 1); max-height: calc(100vh - 32px); overflow-y: auto; }
  @keyframes pop { from { transform: scale(.75); opacity: 0; } }
  .card h2 { font-size: 34px; line-height: 1.1; }
  .card p { font-size: 17px; color: #6d6280; }
  .btn { width: 100%; padding: 13px 16px; border-radius: 16px; font-size: 20px; font-weight: 600; background: #fff; border: 3px solid var(--line); box-shadow: 0 4px 0 var(--line); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: 0 4px 0 #160f24; }
  .row { display: flex; gap: 10px; width: 100%; }
  .stars { font-size: 46px; letter-spacing: 4px; }
  .stars span { display: inline-block; animation: pop .45s cubic-bezier(.2, 1.6, .4, 1) both; }
  .stars .off { filter: grayscale(1) opacity(.28); }
  #levels .card { width: min(720px, 100%); }
  .district { width: 100%; text-align: left; font-size: 18px; font-weight: 600; margin-top: 6px; }
  .grid { width: 100%; display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .lv { aspect-ratio: 1; border-radius: 12px; background: #fff; border: 2px solid var(--line); font-size: 17px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .lv small { font-size: 9px; color: #e8a400; letter-spacing: 1px; margin-top: 3px; height: 9px; }
  .lv:disabled { opacity: .35; cursor: default; }
  .lv.cur { border-color: var(--ink); }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(5, 1fr); } }
  .web-only { }
  .portal .web-only { display: none !important; }
  .more { font-size: 14px; color: #8b7f9c; }
  .more a { color: inherit; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pauseBtn" aria-label="Pause">II</button>

<div class="overlay" id="pause"><div class="card">
  <h2>Paused</h2>
  <button class="btn primary" data-act="resume">Resume</button>
  <div class="row"><button class="btn" data-act="restart">Restart</button><button class="btn" data-act="levels">Levels</button></div>
  <button class="btn" data-act="sound" id="soundBtn">Sound: on</button>
  <p class="more web-only"><a href="../">More games at Bug Arcade</a></p>
</div></div>

<div class="overlay" id="win"><div class="card">
  <h2 id="winTitle">Home safe!</h2>
  <div class="stars" id="winStars"></div>
  <p id="winText"></p>
  <button class="btn primary" data-act="next" id="nextBtn">Next level</button>
  <div class="row"><button class="btn" data-act="restart">Replay</button><button class="btn" data-act="levels">Levels</button></div>
</div></div>

<div class="overlay" id="levels"><div class="card">
  <h2>Levels</h2>
  <div id="levelGrid" style="width:100%"></div>
  <button class="btn" data-act="close-levels">Back</button>
</div></div>

<script src="../portal.js?v=2"></script>
<script src="levels.js"></script>
<script>
(() => {
'use strict';
const { level, G, WALK, MIN_ELEV, LEVELS, DISTRICTS } = window.Levels;
const $ = (id) => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const FONT = 'Fredoka, system-ui, sans-serif';
const DEBUG_BOT = /[?&]bot/.test(location.search);
let portalMuted = false; // the portal's own mute button wins over the in-game toggle

// ---------- save ----------
const store = {
  load() { try { return JSON.parse(Portal.storage.get('shadewalk')) || {}; } catch { return {}; } },
  save(d) { Portal.storage.set('shadewalk', JSON.stringify(d)); },
};
// filled in once the portal SDK is ready (its save data loads during init)
const save = { unlocked: 1, stars: {}, mute: false, current: 1 };
const persist = () => store.save(save);

// ---------- view: logical height 720, width grows with the screen ----------
let VW = 1280, VH = 720, OY = 0, scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  // wide screens see more city; tall phones zoom in to at least an 800-px-wide slice
  scale = w / h >= 16 / 9 ? h / 720 : Math.max(w / 1280, Math.min(w / 800, h / 720));
  VW = w / scale; VH = h / scale; OY = VH - 720;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
}
addEventListener('resize', () => { if (!captureMode) resize(); }); resize();

// ---------- audio ----------
const Audio = (() => {
  let ac = null, master, musicGain, sfxGain, sizzle, sizzleGain, noise, nextBeat = 0, beat = 0;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
    master = ac.createGain(); master.gain.value = save.mute || portalMuted ? 0 : 1; master.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.gain.value = .32; musicGain.connect(master);
    sfxGain = ac.createGain(); sfxGain.gain.value = .9; sfxGain.connect(master);
    noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // continuous sizzle, volume follows how much the vampire is burning
    const src = ac.createBufferSource(); src.buffer = noise; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3800; bp.Q.value = .8;
    sizzleGain = ac.createGain(); sizzleGain.gain.value = 0;
    src.connect(bp).connect(sizzleGain).connect(sfxGain); src.start();
    nextBeat = ac.currentTime + .1;
  }
  function tone(f, d, vol, type = 'sine', when = 0, dest) {
    if (!ac) return;
    const t = ac.currentTime + when, o = ac.createOscillator(), gg = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    gg.gain.setValueAtTime(0, t); gg.gain.linearRampToValueAtTime(vol, t + .01); gg.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(gg).connect(dest || sfxGain); o.start(t); o.stop(t + d + .05);
  }
  function hiss(d, vol, freq, when = 0) {
    if (!ac) return;
    const t = ac.currentTime + when, s = ac.createBufferSource(), f = ac.createBiquadFilter(), gg = ac.createGain();
    s.buffer = noise; f.type = 'lowpass'; f.frequency.value = freq;
    gg.gain.setValueAtTime(vol, t); gg.gain.exponentialRampToValueAtTime(.0001, t + d);
    s.connect(f).connect(gg).connect(sfxGain); s.start(t, Math.random(), d + .1);
  }
  // a small spooky-cute waltz in A minor, scheduled ahead of time
  const BASS = [110, 87.31, 98, 82.41];
  const CHORD = [[220, 261.63, 329.63], [174.61, 220, 261.63], [196, 246.94, 293.66], [164.81, 207.65, 246.94]];
  const MEL = [659.25, 587.33, 523.25, 493.88, 440, 523.25, 587.33, 659.25, 698.46, 659.25, 587.33, 523.25, 493.88, 523.25, 440, 415.3];
  function music(playing) {
    if (!ac || !playing) { if (ac) nextBeat = Math.max(nextBeat, ac.currentTime + .05); return; }
    const spb = 60 / 132;
    while (nextBeat < ac.currentTime + .25) {
      const bar = Math.floor(beat / 3) % 4, b = beat % 3, when = nextBeat - ac.currentTime;
      if (b === 0) tone(BASS[bar], spb * 2.6, .22, 'triangle', when, musicGain);
      else CHORD[bar].forEach((f) => tone(f, spb * .8, .045, 'triangle', when, musicGain));
      if (b !== 1 || beat % 6 === 1) tone(MEL[(beat >> 0) % MEL.length] / (b ? 2 : 1), spb * 1.2, .06, 'sine', when, musicGain);
      nextBeat += spb; beat++;
    }
  }
  return {
    init, music,
    setMute() { if (master) master.gain.value = save.mute || portalMuted ? 0 : 1; },
    suspend() { if (ac) ac.suspend(); }, resume() { if (ac) ac.resume(); },
    sizzle(v) { if (sizzleGain) sizzleGain.gain.setTargetAtTime(v * .22, ac.currentTime, .05); },
    bloom() { [784, 988, 1175].forEach((f, i) => tone(f, .35, .12, 'sine', i * .06)); },
    win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .5, .12, 'triangle', i * .09)); },
    poof() { hiss(.6, .4, 900); tone(220, .5, .15, 'sawtooth'); tone(110, .7, .12, 'sine', .05); },
    bell() { tone(1318, .5, .06); tone(1568, .5, .05, 'sine', .12); },
    click() { tone(660, .06, .06, 'triangle'); },
    star() { tone(1568, .25, .1); tone(2093, .3, .08, 'sine', .08); },
  };
})();

// ---------- game state ----------
let lv, S;
function startLevel(n) {
  n = clamp(n, 1, LEVELS);
  save.current = n; persist();
  lv = level(n);
  S = {
    t: 0, mode: 'play', camX: 0,
    vamp: { x: lv.startX, burn: 0, wait: false, phase: 0, lit: 0, deadT: 0 },
    started: DEBUG_BOT, // he sets off once the player first touches the sun
    sun: { x: VW * .72, y: 150, tx: VW * .72, ty: 150 },
    bloom: lv.flowers.map(() => 0), got: lv.flowers.map(() => false),
    parts: [], tipT: 0, shake: 0, light: 1, winT: 0,
  };
  hideOverlays();
  botNext = 0; botWaited = 0;
  Portal.start();
}

// ---------- geometry: casters and shade ----------
function tramsAt(t) {
  const out = [];
  if (!lv.trams) return out;
  const T = lv.trams, travel = lv.length + 900;
  const first = Math.floor((t - T.offset - travel / T.speed) / T.period);
  for (let k = first; k <= Math.floor((t - T.offset) / T.period) + 1; k++) {
    const t0 = T.offset + k * T.period, x = -450 + (t - t0) * T.speed;
    if (x > -T.w - 500 && x < lv.length + 500) out.push({ x, w: T.w, h: T.h });
  }
  return out;
}
function casters(t) {
  const list = [];
  for (const b of lv.buildings) list.push({ type: 'r', x1: b.x, x2: b.x + b.w, y1: G - b.h, y2: G });
  const h = lv.home; list.push({ type: 'r', x1: h.x, x2: h.x + h.w, y1: G - h.h, y2: G });
  for (const a of lv.awnings) list.push({ type: 'r', x1: a.x, x2: a.x + a.w, y1: a.y, y2: a.y + a.h });
  for (const tr of lv.trees) {
    list.push({ type: 'c', cx: tr.x, cy: G - tr.trunk - tr.r * .7, r: tr.r });
    list.push({ type: 'r', x1: tr.x - 6, x2: tr.x + 6, y1: G - tr.trunk, y2: G });
  }
  for (const tm of tramsAt(t)) list.push({ type: 'r', x1: tm.x, x2: tm.x + tm.w, y1: G - 18 - tm.h, y2: G - 18, tram: true });
  return list;
}
// The sun's left/right position alone sets the light angle (far left = long shadows to the right);
// its height only matters for hiding behind clouds.
function sunDir(sun) {
  const f = clamp((sun.x - 60) / (VW - 120), 0, 1);
  const a = Math.PI - MIN_ELEV - f * (Math.PI - 2 * MIN_ELEV);
  return { dx: Math.cos(a), dy: -Math.sin(a), a };
}
function blocked(px, py, d, list) {
  for (const c of list) {
    if (c.type === 'r') {
      // slab test along the ray; starting inside counts as shade
      let t0 = 0, t1 = 1e9;
      for (const [p, dd, lo, hi] of [[px, d.dx, c.x1, c.x2], [py, d.dy, c.y1, c.y2]]) {
        if (Math.abs(dd) < 1e-9) { if (p < lo || p > hi) { t0 = 1; t1 = 0; break; } continue; }
        let a = (lo - p) / dd, b = (hi - p) / dd; if (a > b) [a, b] = [b, a];
        t0 = Math.max(t0, a); t1 = Math.min(t1, b);
        if (t0 > t1) break;
      }
      if (t0 <= t1) return true;
    } else {
      const ox = px - c.cx, oy = py - c.cy, b = ox * d.dx + oy * d.dy, cc = ox * ox + oy * oy - c.r * c.r;
      if (cc <= 0) return true;
      if (b < 0 && b * b - cc >= 0) return true;
    }
  }
  return false;
}
// cloud k: deterministic drift across the sky
function cloudsAt(t) {
  const out = [];
  const C = lv.clouds; if (!C) return out;
  const span = VW + C.w * 2 + 200, life = span / Math.abs(C.speed);
  for (let k = Math.floor((t - life) / C.every); k <= Math.floor(t / C.every); k++) {
    const age = t - k * C.every; if (age < 0 || age > life) continue;
    const r1 = Math.abs(Math.sin(k * 12.9898 + C.seed * 78.233) * 43758.5453) % 1;
    const x = C.speed > 0 ? -C.w - 100 + age * C.speed : VW + C.w + 100 + age * C.speed;
    out.push({ x, y: 120 + r1 * 210, w: C.w * (.85 + .3 * ((r1 * 7) % 1)), k });
  }
  return out;
}
function sunLight(sun, clouds) {
  let cover = 0;
  for (const c of clouds) {
    const rx = c.w / 2, ry = c.w * .27, q = ((sun.x - c.x) / rx) ** 2 + ((sun.y - c.y) / ry) ** 2;
    cover = Math.max(cover, clamp((1.1 - q) / .45, 0, 1));
  }
  return 1 - cover * .97;
}
function shadeAt(px, py, d, list, light) { return light < .35 || blocked(px, py, d, list); }

// ---------- simulation ----------
const STEP = 1 / 120;
const SUN_SPEED = 1500; // px/s on screen
function moveSun(sun, dt) {
  const dx = sun.tx - sun.x, dy = sun.ty - sun.y, dist = Math.hypot(dx, dy);
  if (dist > .5) {
    const v = Math.min(SUN_SPEED * dt, dist * Math.min(1, dt * 9));
    sun.x += dx / dist * v; sun.y += dy / dist * v;
  }
  clampSun(sun, 'x', 'y');
}
function clampSun(o, kx, ky) {
  o[ky] = clamp(o[ky], -OY + 120, G - 170); // stays below the HUD
  o[kx] = clamp(o[kx], 40, VW - 40);
}
function vampPoints(x) { return [[x - 7, G - 12], [x + 5, G - 44], [x, G - 74]]; }

function step(dt) {
  S.t += dt;
  const v = S.vamp;
  moveSun(S.sun, dt);
  if (S.mode !== 'play') {
    if (S.mode === 'dead') v.deadT += dt;
    return;
  }
  const d = sunDir(S.sun), list = casters(S.t), clouds = cloudsAt(S.t);
  S.light = sunLight(S.sun, clouds);
  // vampire
  if (!S.started) return;
  if (S.startT === undefined) S.startT = S.t;
  if (!v.wait) { v.x += WALK * dt; v.phase += dt * 7; }
  let litN = 0;
  for (const [px, py] of vampPoints(v.x)) if (!shadeAt(px, py, d, list, S.light)) litN++;
  v.lit = litN / 3 * S.light;
  if (v.lit > 0) v.burn += v.lit * .62 * dt; else v.burn = Math.max(0, v.burn - .1 * dt);
  if (v.lit > 0 && Math.random() < v.lit * 1.4) S.parts.push(smoke(v.x + (Math.random() - .5) * 26, G - 30 - Math.random() * 50));
  if (v.burn >= 1) return die();
  if (v.x >= lv.home.x + 70) return win();
  // flowers bloom in the light, but only where the player can see them
  lv.flowers.forEach((f, i) => {
    if (S.got[i]) return;
    const sx = f.x - S.camX; if (sx < -30 || sx > VW + 30) return;
    if (!shadeAt(f.x, f.y - 46, d, list, S.light)) {
      S.bloom[i] = Math.min(1, S.bloom[i] + dt / 1.1);
      if (S.bloom[i] >= 1) { S.got[i] = true; Audio.star(); for (let k = 0; k < 14; k++) S.parts.push(sparkle(f.x, f.y - 50)); }
    }
  });
  // camera keeps the vampire at a third of the screen
  const target = clamp(v.x - VW * .34, 0, Math.max(0, lv.length + 160 - VW));
  S.camX = lerp(S.camX, target, Math.min(1, dt * 4));
  if (DEBUG_BOT) bot(dt);
}
function die() {
  S.mode = 'dead'; S.vamp.deadT = 0; S.shake = 1;
  Audio.poof(); Audio.sizzle(0);
  for (let k = 0; k < 40; k++) S.parts.push(ash(S.vamp.x, G - 40));
  Portal.stop();
}
function win() {
  S.mode = 'win'; S.winT = 0;
  Audio.win(); Audio.sizzle(0);
  const stars = S.got.filter(Boolean).length;
  save.stars[lv.n] = Math.max(save.stars[lv.n] || 0, stars);
  if (lv.n >= save.unlocked) save.unlocked = Math.min(LEVELS, lv.n + 1);
  persist();
  Portal.stop(); if (stars === 3) Portal.happy();
  setTimeout(() => showWin(stars), 900);
}

// ---------- particles ----------
const smoke = (x, y) => ({ k: 'smoke', x, y, vx: (Math.random() - .5) * 20, vy: -40 - Math.random() * 40, life: 0, max: .9 + Math.random() * .5, r: 6 + Math.random() * 6 });
const sparkle = (x, y) => ({ k: 'spark', x, y, vx: (Math.random() - .5) * 260, vy: -Math.random() * 260, life: 0, max: .8, r: 4 });
const ash = (x, y) => ({ k: 'ash', x, y, vx: (Math.random() - .5) * 220, vy: -Math.random() * 260, life: 0, max: 1.4, r: 3 + Math.random() * 4 });
function updateParts(dt) {
  for (const p of S.parts) {
    p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.k === 'smoke') { p.r += dt * 14; p.vx *= .98; }
    else { p.vy += 600 * dt; if (p.y > G + 10) { p.y = G + 10; p.vy *= -.3; p.vx *= .6; } }
  }
  S.parts = S.parts.filter((p) => p.life < p.max);
}

// ---------- input ----------
const pointers = new Map();
let usingKeys = false;
function toView(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale - OY]; }
function waitBtn() { return { x: VW - 92, y: 720 - 92 + Math.min(OY, 0), r: 62 }; }
function onWait(x, y) { const b = waitBtn(); return Math.hypot(x - b.x, y - b.y) < b.r + 10; }
cv.addEventListener('pointerdown', (e) => {
  Audio.init();
  const [x, y] = toView(e);
  if (S.mode === 'dead' && S.vamp.deadT > .5) { startLevel(lv.n); return; }
  if (S.mode !== 'play') return;
  if (onWait(x, y)) { pointers.set(e.pointerId, 'wait'); S.vamp.wait = true; Audio.click(); }
  else { pointers.set(e.pointerId, 'sun'); S.sun.tx = x; S.sun.ty = y; cv.classList.add('dragging'); S.dragged = true; }
  S.started = true;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', (e) => {
  const [x, y] = toView(e), role = pointers.get(e.pointerId);
  // a mouse moves the sun without holding a button; touch needs a finger down
  if (role === 'sun' || (e.pointerType === 'mouse' && role !== 'wait' && !onWait(x, y))) {
    if (S && S.mode === 'play') { S.sun.tx = x; S.sun.ty = y; usingKeys = false; if (e.pointerType === 'mouse' && Math.hypot(x - S.sun.x, y - S.sun.y) < 400) { S.dragged = true; S.started = true; } }
  }
});
const release = (e) => {
  const role = pointers.get(e.pointerId); pointers.delete(e.pointerId);
  if (role === 'wait' && ![...pointers.values()].includes('wait')) S.vamp.wait = keys.has('wait');
  cv.classList.remove('dragging');
};
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
const keys = new Set();
addEventListener('keydown', (e) => {
  Audio.init();
  const k = e.code;
  if (k === 'Space' || k === 'ShiftLeft' || k === 'ShiftRight' || k === 'KeyS' || k === 'ArrowDown') {
    e.preventDefault(); keys.add('wait');
    if (S.mode === 'play') { S.vamp.wait = true; S.started = true; }
    else if (S.mode === 'dead' && S.vamp.deadT > .5) startLevel(lv.n);
  }
  if (k === 'ArrowLeft' || k === 'KeyA') { keys.add('left'); e.preventDefault(); }
  if (k === 'ArrowRight' || k === 'KeyD') { keys.add('right'); e.preventDefault(); }

    g.fillStyle = 'rgba(43,33,64,.8)'; rr(VW / 2 - w / 2, y, w, 54, 27); g.fill();

  }

  const since = S.t - (S.startT ?? S.t);

  if (!show) return;
  const a = tip === 'drag' && !S.dragged ? 1 : clamp(((tip === 'drag' ? 4 : 7) - since) / 1.5, 0, 1);
  g.globalAlpha = a;
  const text = msgs[tip];
  g.font = `600 26px ${FONT}`; const w = g.measureText(text).width + 40;
  const y = -OY + 92;
  g.fillStyle = 'rgba(43,33,64,.88)'; rr(VW / 2 - w / 2, y, w, 50, 25); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.fillText(text, VW / 2, y + 34);
  if (tip === 'drag' && !S.dragged) {

    const k = (Math.sin(S.t * 2) + 1) / 2, hx = lerp(VW * .3, VW * .7, k), hy = 230 - Math.sin(k * Math.PI) * 60;

function drawDead() {

  const a = clamp((S.vamp.deadT - .4) / .3, 0, 1);
  g.globalAlpha = a;
  g.fillStyle = 'rgba(43,33,64,.9)'; rr(VW / 2 - 230, 230, 460, 140, 28); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = `700 40px ${FONT}`; g.fillText('Too sunny! ☀️', VW / 2, 292);
  g.font = `500 22px ${FONT}`; g.fillText(matchMedia('(pointer: fine)').matches ? 'click or press SPACE to retry' : 'tap to retry', VW / 2, 338);
  g.globalAlpha = 1;

function render(clean) {
  const d = sunDir(S.sun), list = casters(S.t), clouds = cloudsAt(S.t);
  g.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  g.translate(0, OY);
  if (S.shake > 0) { g.translate((Math.random() - .5) * 12 * S.shake, (Math.random() - .5) * 8 * S.shake); }
  drawSky(d);
  drawSun(S.t);
  drawClouds(clouds); // clouds pass in front of the sun
  drawBackdrop();
  drawStreet();
  for (const b of lv.buildings) drawBuilding(b);
  drawHome();
  for (const tm of tramsAt(S.t)) drawTram(tm);
  for (const a of lv.awnings) drawAwning(a);
  for (const tr of lv.trees) drawTree(tr);
  drawShadows(d, list);
  lv.flowers.forEach(drawFlower);
  drawVampire();
  drawParts();

  if (S.vamp.lit > 0 && S.mode === 'play') { g.fillStyle = `rgba(255,120,40,${.08 + S.vamp.burn * .12})`; g.fillRect(0, -OY, VW, 720 + OY); }
  if (clean) return; // covers and previews skip the HUD
  drawHud();
  drawTip();
  drawDead();
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (!S || captureMode) return;
  const paused = $('pause').classList.contains('on') || adPause;
  if (!paused) {
    acc += dt;
    while (acc >= STEP) { keySun(STEP); step(STEP); acc -= STEP; }
    updateParts(dt);
    S.shake = Math.max(0, S.shake - dt * 3);
    if (S.mode === 'win') S.winT += dt;
    Audio.sizzle(S.mode === 'play' ? S.vamp.lit : 0);
  }
  Audio.music(!paused && !save.mute && !portalMuted);
  render();
}

// ---------- menus ----------
let adPause = false;
function hideOverlays() { document.querySelectorAll('.overlay').forEach((o) => o.classList.remove('on')); }
function togglePause() {
  if (!S || S.mode === 'win') return;
  const p = $('pause');
  if (p.classList.contains('on')) { p.classList.remove('on'); if (S.mode === 'play') Portal.start(); }
  else { hideOverlays(); p.classList.add('on'); Portal.stop(); Audio.sizzle(0); }
}
$('pauseBtn').addEventListener('click', () => { Audio.init(); togglePause(); });
function showWin(stars) {
  $('winStars').innerHTML = [0, 1, 2].map((i) => `<span class="${i < stars ? '' : 'off'}" style="animation-delay:${.1 + i * .15}s">🌻</span>`).join('');
  $('winTitle').textContent = stars === 3 ? 'Perfect stroll!' : 'Home safe!';
  $('winText').textContent = stars === 3 ? 'Every sunflower bloomed.' : `${stars} of 3 sunflowers bloomed.`;
  $('nextBtn').style.display = lv.n < LEVELS ? '' : 'none';
  if (lv.n >= LEVELS) $('winText').textContent += ' You finished every district!';
  $('win').classList.add('on');
}
function buildLevelGrid() {
  const box = $('levelGrid'); box.innerHTML = '';
  DISTRICTS.forEach((name, di) => {
    const h = document.createElement('div'); h.className = 'district'; h.textContent = name; box.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'grid';
    for (let n = di * 10 + 1; n <= di * 10 + 10; n++) {
      const b = document.createElement('button'); b.className = 'lv' + (n === lv.n ? ' cur' : '');
      b.disabled = n > save.unlocked;
      const st = save.stars[n] || 0;
      b.innerHTML = `${n > save.unlocked ? '🔒' : n}<small>${st ? '★'.repeat(st) : ''}</small>`;
      b.addEventListener('click', () => { Audio.click(); startLevel(n); });
      grid.appendChild(b);
    }
    box.appendChild(grid);
  });
}
document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
  Audio.init(); Audio.click();
  const act = b.dataset.act;
  if (act === 'resume') togglePause();
  if (act === 'restart') startLevel(lv.n);
  if (act === 'levels') { hideOverlays(); buildLevelGrid(); $('levels').classList.add('on'); Portal.stop(); }
  if (act === 'close-levels') { hideOverlays(); if (S.mode === 'play') Portal.start(); else if (S.mode === 'win') $('win').classList.add('on'); }
  if (act === 'sound') { save.mute = !save.mute; persist(); Audio.setMute(); $('soundBtn').textContent = 'Sound: ' + (save.mute ? 'off' : 'on'); }
  if (act === 'next') {
    const n = lv.n + 1;
    // a short break between levels, never in the first few
    if (n >= 4 && n % 3 === 1) {
      hideOverlays();
      Portal.break(() => { adPause = true; Audio.suspend(); }, () => { adPause = false; Audio.resume(); }).then(() => startLevel(n));
    } else startLevel(n);
  }
}));
$('soundBtn').textContent = 'Sound: ' + (save.mute ? 'off' : 'on');
document.addEventListener('visibilitychange', () => { if (document.hidden && S && S.mode === 'play' && !$('pause').classList.contains('on')) togglePause(); });

// players land straight in gameplay, once saved progress is available
Portal.ready.then(() => {
  Object.assign(save, store.load());
  $('soundBtn').textContent = 'Sound: ' + (save.mute ? 'off' : 'on');
  startLevel(Math.min(save.current || 1, save.unlocked));
  Portal.loaded();
  requestAnimationFrame(frame);
});
Portal.onMute((m) => { portalMuted = m; Audio.setMute(); });
// ---------- capture (?bot only): portal covers and preview videos, rendered offline ----------
let captureMode = false;
function setView(w, h) {
  captureMode = true; dpr = 1;
  scale = w / h >= 16 / 9 ? h / 720 : Math.max(w / 1280, Math.min(w / (w < h ? 700 : 900), h / 720));
  VW = w / scale; VH = h / scale; OY = VH - 720;
  cv.width = w; cv.height = h; cv.style.width = (w / 4) + 'px'; cv.style.height = (h / 4) + 'px';
}
function drawTitle(cx, cy, size) {
  g.save(); g.textAlign = 'center'; g.lineJoin = 'round';
  g.font = `700 ${size}px ${FONT}`;
  g.lineWidth = size * .22; g.strokeStyle = '#2b2140'; g.strokeText('SHADEWALK', cx, cy);
  const gr = g.createLinearGradient(0, cy - size, 0, cy); gr.addColorStop(0, '#ffe58a'); gr.addColorStop(1, '#ff9a3d');
  g.fillStyle = gr; g.fillText('SHADEWALK', cx, cy);
  g.restore();
}
async function postCanvas(name, type = 'image/jpeg', q = .92) {
  const b = await new Promise((r) => cv.toBlob(r, type, q));
  await fetch('http://127.0.0.1:8771/save/' + (name.includes('/') ? 'shadewalk-' + name.split('/')[0] + '/' + name.split('/')[1] : 'shadewalk-media/' + name), { method: 'POST', body: b });
}
// a posed scene: low sun, long shadows, the vampire safe in the shade, a sunflower in bloom
function poseCover(n) {
  startLevel(n); S.started = true; hideOverlays();
  S.sun.x = S.sun.tx = VW * .16; S.sun.y = S.sun.ty = 170;
  // stand clear of trees so the silhouette reads, every sunflower in bloom
  const tree = lv.trees.find((t) => t.x > lv.gaps[0].x0 && t.x < lv.gaps[0].x1);
  S.vamp.x = tree && tree.x - lv.gaps[0].x0 < 200 ? tree.x + 110 : lv.gaps[0].x0 + 60;
  S.camX = Math.max(0, S.vamp.x - VW * .42);

}
async function covers() {
  for (const [name, w, h] of [['cover-landscape', 1920, 1080], ['cover-portrait', 800, 1200], ['cover-square', 800, 800]]) {
    setView(w, h); poseCover(4);
    for (let i = 0; i < 30; i++) step(STEP);
    S.vamp.phase = .6; render(true);
    g.setTransform(scale, 0, 0, scale, 0, 0);
    drawTitle(VW / 2, Math.min(OY + 230, VH * .3), Math.min(150, VW * .13));
    await postCanvas(name + '.png', 'image/png');
  }
  return 'covers saved';
}
// preview: 1 s on the cover, then the bot plays; silent, starts on the cover as portals ask
async function preview(orient, n = 22, secs = 18) {
  const [w, h] = orient === 'land' ? [1920, 1080] : [1080, 1620];
  setView(w, h); poseCover(4);
  for (let i = 0; i < 30; i++) step(STEP);
  render(true); g.setTransform(scale, 0, 0, scale, 0, 0); drawTitle(VW / 2, Math.min(OY + 230, VH * .3), Math.min(150, VW * .13));
  for (let f = 0; f < 30; f++) await postCanvas(`${orient}/frame_${String(f).padStart(5, '0')}.jpg`);

  for (let f = 30; f < secs * 30; f++) {
    for (let k = 0; k < 4; k++) step(STEP);
    updateParts(1 / 30); if (S.mode === 'win') S.winT += 1 / 30;
    render(true);
    await postCanvas(`${orient}/frame_${String(f).padStart(5, '0')}.jpg`);

}
window.__sw = { get S() { return S; }, get lv() { return lv; }, startLevel, casters, sunDir, cloudsAt, covers, preview,
  // ?bot only: play level n headless at full speed and report the outcome
  botRun(n) {
    startLevel(n); S.started = true; botNext = 0; botWaited = 0;
    while (S.mode === 'play' && S.t < 400) step(STEP);
    const res = { n, result: S.mode, t: Math.round(S.t), stars: S.got.filter(Boolean).length, maxBurn: 0, x: Math.round(S.vamp.x), len: Math.round(lv.length) };
    return res;
  } };
})();
